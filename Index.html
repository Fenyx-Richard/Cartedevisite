<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Carte de visite — Fenyx Ouvertures</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Raleway:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 40px;
    padding: 40px 20px;
    font-family: 'Raleway', sans-serif;
  }

  .label {
    color: #8a9ab0;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  /* ─── CARTE RECTO ─── */
  .card {
    width: 90mm;
    height: 55mm;
    position: relative;
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(200,120,42,0.2);
  }

  /* RECTO */
  .card-recto {
    background: #0d1b2a;
  }

  /* Texture subtile */
  .card-recto::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(
        45deg,
        transparent,
        transparent 40px,
        rgba(200,120,42,0.02) 40px,
        rgba(200,120,42,0.02) 41px
      );
  }

  /* Bande dorée gauche */
  .card-recto .gold-band {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, #c8782a, #e8a050, #c8782a);
  }

  /* Bande dorée bas */
  .card-recto .gold-band-bottom {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 2px;
    background: linear-gradient(90deg, #c8782a, #e8a050 50%, transparent);
  }

  .card-recto .content {
    position: relative;
    z-index: 2;
    padding: 7mm 6mm 6mm 9mm;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .card-recto .top {
    display: flex;
    align-items: flex-start;
    gap: 5mm;
  }

  .card-recto .logo {
    width: 18mm;
    height: 14mm;
    object-fit: contain;
    filter: drop-shadow(0 0 8px rgba(200,120,42,0.4));
    flex-shrink: 0;
  }

  .card-recto .brand {
    padding-top: 1mm;
  }

  .card-recto .brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 4px;
    color: #e8a050;
    text-transform: uppercase;
    line-height: 1;
  }

  .card-recto .brand-tagline {
    font-size: 7px;
    letter-spacing: 2.5px;
    color: #8a9ab0;
    text-transform: uppercase;
    margin-top: 3px;
  }

  .card-recto .divider {
    width: 30mm;
    height: 1px;
    background: linear-gradient(90deg, rgba(200,120,42,0.6), transparent);
    margin-top: 5px;
  }

  .card-recto .person {
    margin-top: auto;
  }

  .card-recto .person-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-weight: 400;
    color: #f0e8d8;
    letter-spacing: 1px;
    line-height: 1;
  }

  .card-recto .person-title {
    font-size: 7px;
    letter-spacing: 2px;
    color: #c8782a;
    text-transform: uppercase;
    margin-top: 3px;
  }

  /* VERSO */
  .card-verso {
    background: linear-gradient(135deg, #0d1b2a 0%, #162235 60%, #0d1b2a 100%);
  }

  .card-verso::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 40px,
        rgba(200,120,42,0.015) 40px,
        rgba(200,120,42,0.015) 41px
      );
  }

  /* Motif phénix watermark */
  .card-verso .watermark {
    position: absolute;
    right: -5mm;
    top: 50%;
    transform: translateY(-50%);
    width: 35mm;
    height: 28mm;
    object-fit: contain;
    opacity: 0.06;
    filter: drop-shadow(0 0 2px rgba(200,120,42,0.2));
  }

  .card-verso .content {
    position: relative;
    z-index: 2;
    padding: 6mm 6mm 6mm 8mm;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .card-verso .co-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    letter-spacing: 3.5px;
    color: #e8a050;
    text-transform: uppercase;
  }

  .card-verso .gold-line {
    width: 20mm;
    height: 1px;
    background: linear-gradient(90deg, rgba(200,120,42,0.7), transparent);
    margin-top: 4px;
    margin-bottom: 6px;
  }

  .card-verso .contacts {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .card-verso .contact-row {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .card-verso .contact-icon {
    width: 3mm;
    height: 3mm;
    background: rgba(200,120,42,0.3);
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-verso .contact-text {
    font-size: 8px;
    color: #c0ccd8;
    letter-spacing: 0.5px;
  }

  .card-verso .contact-text.highlight {
    color: #e8ddd0;
    font-weight: 500;
  }

  .card-verso .footer {
    border-top: 1px solid rgba(200,120,42,0.15);
    padding-top: 4px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .card-verso .siret {
    font-size: 6px;
    color: #6a7a8a;
    letter-spacing: 0.5px;
  }

  .card-verso .address {
    font-size: 6.5px;
    color: #7a8a9a;
    text-align: right;
    letter-spacing: 0.3px;
    line-height: 1.5;
  }

  /* Print button */
  .print-btn {
    background: linear-gradient(135deg, #c8782a, #e8a050);
    color: white;
    border: none;
    padding: 12px 28px;
    border-radius: 6px;
    font-family: 'Raleway', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(200,120,42,0.3);
    transition: all 0.2s;
  }
  .print-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(200,120,42,0.45); }

  @media print {
    body { background: white; padding: 10mm; flex-direction: row; flex-wrap: wrap; gap: 5mm; justify-content: flex-start; }
    .label, .print-btn { display: none; }
    .card { box-shadow: none; border: 0.5pt solid #ccc; }
  }
</style>
</head>
<body>

<p class="label">Recto</p>

<!-- RECTO -->
<div class="card card-recto">
  <div class="gold-band"></div>
  <div class="gold-band-bottom"></div>
  <div class="content">
    <div class="top">
      <img class="logo" src="" alt="Fenyx">
      <div class="brand">
        <div class="brand-name">Fenyx Ouvertures</div>
        <div class="brand-tagline">Redonner vie à vos menuiseries</div>
        <div class="divider"></div>
      </div>
    </div>
    <div class="person">
      <div class="person-name">Richard Dekeyser</div>
      <div class="person-title">Spécialiste menuiseries PVC · Alu · Bois</div>
    </div>
  </div>
</div>

<p class="label">Verso</p>

<!-- VERSO -->
<div class="card card-verso">
  <img class="watermark" src=""alt="">
  <div class="content">
    <div>
      <div class="co-name">Fenyx Ouvertures</div>
      <div class="gold-line"></div>
      <div class="contacts">
        <div class="contact-row">
          <div class="contact-icon"></div>
          <span class="contact-text highlight">06 19 04 51 94</span>
        </div>
        <div class="contact-row">
          <div class="contact-icon"></div>
          <span class="contact-text">contact.fenyxouvertures@gmail.com</span>
        </div>
        <div class="contact-row">
          <div class="contact-icon"></div>
          <span class="contact-text">133 rue Louis Montois — 59790 Ronchin</span>
        </div>
      </div>
    </div>
    <div class="footer">
      <div class="siret">SIRET 10157412700011 · SAS</div>
      <div class="address"></div>
    </div>
  </div>
</div>

<button class="print-btn" onclick="window.print()">🖨️ Imprimer</button>

</body>
</html>
